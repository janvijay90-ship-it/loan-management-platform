spring.application.name=api-gateway

server.port=8080

# Redis Configuration for Rate Limiting
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Downstream Microservices Routing
services.loan-service.url=http://localhost:8081
services.disbursement-service.url=http://localhost:8083

# Rate Limiter Settings
gateway.rate-limit.requests-per-minute=60

# JWT Configuration
gateway.jwt.secret=LoanManagementPlatformSecretKey2026SecureJWTKey!

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Eureka Client Registration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

