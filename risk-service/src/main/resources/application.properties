spring.application.name=risk-service

server.port=8082

# Connects to postgres-risk defined in docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5433/risk_db
spring.datasource.username=risk_user
spring.datasource.password=risk_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Consumer Configuration
# Ignore headers sent by producer and map to a generic Map
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=risk-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.Map

# Kafka Producer Configuration for Risk Service
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer