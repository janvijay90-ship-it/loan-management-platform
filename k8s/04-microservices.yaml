# Loan Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: loan-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-service
  template:
    metadata:
      labels:
        app: loan-service
    spec:
      containers:
        - name: loan-service
          image: 306317596640.dkr.ecr.ap-south-1.amazonaws.com/loan-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-loan:5432/loan_db
            - name: SPRING_DATASOURCE_USERNAME
              value: loan_user
            - name: SPRING_DATASOURCE_PASSWORD
              value: loan_password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-registry:8761/eureka/
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: loan-system
spec:
  selector:
    app: loan-service
  ports:
    - port: 8081
      targetPort: 8081
---
