# API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: loan-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: loan-management-platform-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVICES_LOAN_SERVICE_URL
              value: http://loan-service:8081
            - name: SERVICES_DISBURSEMENT_SERVICE_URL
              value: http://disbursement-service:8083
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-registry:8761/eureka/
---
# Expose API Gateway directly on localhost:8080 via LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: loan-system
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
# Loan Portal (Web UI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-portal
  namespace: loan-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-portal
  template:
    metadata:
      labels:
        app: loan-portal
    spec:
      containers:
        - name: loan-portal
          image: loan-management-platform-loan-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
# Expose Web Portal on localhost:80 via LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: loan-portal
  namespace: loan-system
spec:
  type: LoadBalancer
  selector:
    app: loan-portal
  ports:
    - port: 80
      targetPort: 80
