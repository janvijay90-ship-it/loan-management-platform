# API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: loan-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 306317596640.dkr.ecr.ap-south-1.amazonaws.com/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SERVICES_LOAN_SERVICE_URL
              value: http://loan-service:8081
            - name: SERVICES_DISBURSEMENT_SERVICE_URL
              value: http://disbursement-service:8083
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-registry:8761/eureka/
---
# Expose API Gateway to Internet via AWS Network/Application LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: loan-system
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
# Loan Portal (Web UI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-portal
  namespace: loan-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-portal
  template:
    metadata:
      labels:
        app: loan-portal
    spec:
      containers:
        - name: loan-portal
          image: 306317596640.dkr.ecr.ap-south-1.amazonaws.com/loan-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
# Expose Loan Portal to Internet via AWS LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: loan-portal
  namespace: loan-system
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: loan-portal
  ports:
    - port: 80
      targetPort: 80
