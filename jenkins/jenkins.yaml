# ============================================================
#  Jenkins Configuration as Code (JCasC)
#  Auto-configures: JDK 17, Maven 3.9, admin user, pipeline job
#  Plugins are installed by Jenkins itself on first boot.
# ============================================================

jenkins:
  systemMessage: "Loan Management Platform — Jenkins CI/CD 🚀"
  numExecutors: 4
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: "Admin"
          password: "admin123"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

tool:
  jdk:
    installations:
      - name: "JDK-17"
        home: "/opt/java/openjdk"

  maven:
    installations:
      - name: "Maven-3"
        home: "/opt/maven"

jobs:
  - script: |
      pipelineJob('loan-management-platform') {
        description('CI/CD pipeline for the Loan Management Platform microservices')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/janvijay90-ship-it/loan-management-platform.git')
                }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
        triggers {
          scm('H/5 * * * *')
        }
      }
