# ============================================================
#  Jenkins Configuration as Code (JCasC)
#  Auto-configures: JDK 17, Maven 3.9, Global credentials,
#  and a seed Pipeline job pointing at this repo.
# ============================================================

jenkins:
  systemMessage: "Loan Management Platform — Jenkins CI/CD"
  numExecutors: 4
  mode: NORMAL

  # ---- Security: disable setup wizard & use simple security ----
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: "Admin"
          password: "admin123"          # CHANGE IN PRODUCTION

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

tool:
  jdk:
    installations:
      - name: "JDK-17"
        home: "/opt/java/openjdk"       # JDK already bundled in jenkins:lts-jdk17

  maven:
    installations:
      - name: "Maven-3"
        home: "/opt/maven"             # Installed by Dockerfile

jobs:
  - script: |
      pipelineJob('loan-management-platform') {
        description('Full CI/CD pipeline for the Loan Management Platform microservices')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  // UPDATE URL below after pushing to GitHub
                  url('https://github.com/YOUR_USERNAME/loan-management-platform.git')
                }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
        triggers {
          scm('H/5 * * * *')   // Poll every 5 minutes; replace with webhook in prod
        }
      }
